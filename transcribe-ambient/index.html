<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcribe_Ambient | Enterprise AI Pipeline Portfolio Showcase</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }
    .pulse-glow { animation: pulseGlow 3s infinite ease-in-out; transform-origin: center; }
    
    /* Sitewide Circuit Background Overlay */
    .circuit-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
    }

    .glass-panel {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .terminal-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .terminal-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-[#0B0F19] text-[#E2E8F0] antialiased min-h-screen font-sans selection:bg-cyan-500 selection:text-white relative overflow-x-hidden">

  <!-- SITENIDE AMBIENT CIRCUIT SVG BACKGROUND -->
  <svg class="circuit-bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
    <g stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4">
      <!-- Left Margin Traces -->
      <path d="M0 150 H120 L180 210 V400 L220 440 H350" />
      <path d="M0 320 H80 L140 380 V550 L180 590 H300" />
      <path d="M0 650 H150 L210 590 H400 L450 640 H600" />
      <!-- Right Margin Traces -->
      <path d="M1440 200 H1320 L1260 260 V500 L1220 540 H1050" />
      <path d="M1440 480 H1280 L1220 540 H950" />
      <path d="M1440 700 H1350 L1290 640 H1100" />
    </g>
    <!-- Glowing Node Terminals (Vias) -->
    <g fill="#22d3ee">
      <circle cx="180" cy="210" r="3" class="pulse-glow" />
      <circle cx="220" cy="440" r="2.5" />
      <circle cx="140" cy="380" r="3" class="pulse-glow" style="animation-delay: 1s;" />
      <circle cx="210" cy="590" r="2.5" />
      <circle cx="1260" cy="260" r="3" class="pulse-glow" style="animation-delay: 0.5s;" />
      <circle cx="1220" cy="540" r="2.5" />
      <circle cx="1290" cy="640" r="3" class="pulse-glow" style="animation-delay: 1.5s;" />
    </g>
  </svg>

  <!-- CONTENT WRAPPER (Sits above circuit background) -->
  <div class="relative z-10">

    <!-- TOP HERO NAVIGATION -->
    <header class="border-b border-slate-800/80 bg-[#0B0F19]/90 sticky top-0 z-50 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" />
            </svg>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-lg text-white tracking-tight">Transcribe_Ambient</span>
              <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">Zero-Cloud AI</span>
            </div>
            <p class="text-xs text-slate-400">Enterprise Ambient Audio DSP & Local LLM Transcription Pipeline</p>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="flex items-center space-x-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
          <button onclick="switchTab('overview')" id="tab-btn-overview" class="tab-btn px-4 py-2 text-xs font-medium rounded-lg transition-all bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
            Process Overview
          </button>
          <button onclick="switchTab('gui')" id="tab-btn-gui" class="tab-btn px-4 py-2 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white">
            Interactive App Mockup
          </button>
          <button onclick="switchTab('audio-lab')" id="tab-btn-audio-lab" class="tab-btn px-4 py-2 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white">
            DSP & Transcript Diff
          </button>
          <button onclick="switchTab('business')" id="tab-btn-business" class="tab-btn px-4 py-2 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white">
            Business ROI & Privacy
          </button>
          <button onclick="switchTab('video-script')" id="tab-btn-video-script" class="tab-btn px-4 py-2 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white">
            Video Demo Storyboard
          </button>
        </nav>

        <!-- Portfolio Author Tag -->
        <div class="hidden md:flex items-center space-x-2 text-xs text-slate-400">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span>Engineer: <strong class="text-slate-200">Garrett Papit</strong></span>
        </div>
      </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-6 py-8">
      <!-- [Your existing tab contents remain identical below] -->
    </main>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Tab Switching Function
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-cyan-500/20', 'text-cyan-300', 'border', 'border-cyan-500/30');
        btn.classList.add('text-slate-400');
      });

      const targetContent = document.getElementById('tab-' + tabId);
      const targetBtn = document.getElementById('tab-btn-' + tabId);

      if (targetContent) targetContent.classList.remove('hidden');
      if (targetBtn) {
        targetBtn.classList.remove('text-slate-400');
        targetBtn.classList.add('bg-cyan-500/20', 'text-cyan-300', 'border', 'border-cyan-500/30');
      }
    }
  </script>
</body>
</html>
